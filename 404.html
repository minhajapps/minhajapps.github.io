<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Minhaj Apps</title>
  <link rel="icon" type="image/png" sizes="384x384" href="/favicon.png" />
  <script>
    (function () {
      var l = window.location;
      var fullPath = l.pathname + l.search + l.hash;
      try { sessionStorage.setItem('minhaj_spa_redirect', fullPath); } catch (e) {}
      l.replace(l.protocol + '//' + l.host + '/?r=' + encodeURIComponent(fullPath));
    })();
  </script>
</head>
<body></body>
</html>
