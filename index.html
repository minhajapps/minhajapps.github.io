    "@context": "https://schema.org",

    "inLanguage": "bn"
  }

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('minhaj_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>

  <style>
    :root {
      --bg: #f8f9fc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --surface-3: #f8f9fc;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #5b6e8c;
      --accent: #10b981;
      --accent-soft: rgba(16, 185, 129, 0.1);
      --accent-border: rgba(16, 185, 129, 0.2);
      --star-empty: #cbd5e1;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      --header-bg: #ffffff;
    }

    html.dark {
      --bg: #0f1216;
      --surface: #1a1f26;
      --surface-2: #252b35;
      --surface-3: #0f1216;
      --border: rgba(255, 255, 255, 0.06);
      --text: #ffffff;
      --muted: #a0a6b1;
      --accent: #00ff88;
      --accent-soft: rgba(0, 255, 136, 0.1);
      --accent-border: rgba(0, 255, 136, 0.2);
      --star-empty: #475569;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.22);
      --header-bg: #1a1f26;
      color-scheme: dark;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Noto Sans Bengali', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--bg);
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 115px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    img, svg {
      -webkit-user-drag: none;
      user-select: none;
    }

    button, input, textarea {
      font-family: inherit;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Poloja Header */
    .app-header {
      background: var(--header-bg);
      padding: 13px clamp(15px, 4vw, 20px);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .header-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
    }

    .logo-link {
      display: flex;
      align-items: center;
      gap: clamp(9px, 2.5vw, 12px);
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      text-decoration: none;
      text-align: left;
      white-space: nowrap;
      flex-shrink: 0;
      color: var(--text);
    }

    .logo-img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #10b981;
      object-fit: cover;
      display: block;
      flex-shrink: 0;
      background: var(--surface-2);
    }

    .logo-text {
      font-size: clamp(14.5px, 4.4vw, 18.5px);
      font-weight: 700;
      line-height: 1.15;
      white-space: nowrap;
      color: var(--text);
      letter-spacing: 0.2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: clamp(9px, 2.6vw, 13px);
      flex-shrink: 0;
    }

    .theme-toggle, .menu-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      width: clamp(38px, 10vw, 40px);
      height: clamp(38px, 10vw, 40px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: 0.2s;
    }

    .theme-toggle:active, .menu-btn:active {
      transform: scale(0.94);
    }

    .menu-btn.active {
      background: #10b981;
      border-color: #10b981;
      color: #ffffff;
    }

    .telegram-icon {
      background: linear-gradient(135deg, #0088cc, #00aaff);
      width: clamp(38px, 10vw, 40px);
      height: clamp(38px, 10vw, 40px);
      flex-shrink: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      box-shadow: 0 0 8px rgba(0, 136, 204, 0.5);
      animation: pulseGlow 1.8s infinite ease-in-out;
      transition: transform 0.25s;
    }

    .telegram-icon:hover {
      transform: scale(1.08);
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(0, 136, 204, 0.6); }
      50% { box-shadow: 0 0 0 8px rgba(0, 136, 204, 0.2); }
      100% { box-shadow: 0 0 0 0 rgba(0, 136, 204, 0); }
    }

    /* Poloja Menu Dropdown */
    .menu-container {
      position: relative;
    }

    .menu-dropdown {
      position: absolute;
      top: 52px;
      right: 0;
      background: var(--surface);
      border-radius: 20px;
      border: 1px solid var(--border);
      min-width: 240px;
      max-height: calc(100vh - 80px);
      overflow-y: auto;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.14);
      z-index: 1001;
      display: none;
    }

    .menu-dropdown.show {
      display: block;
      transform-origin: top right;
      animation: modalZoomIn 0.2s ease-out;
    }

    .menu-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 18px;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      text-align: left;
      white-space: nowrap;
    }

    .menu-item:hover {
      background: var(--surface-2);
      padding-left: 22px;
    }

    .menu-item.active {
      color: var(--accent);
      font-weight: 600;
      background: var(--accent-soft);
    }

    .menu-icon-slot {
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .menu-footer {
      padding: 12px 16px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    /* Main Page Content */
    .page-content {
      flex: 1;
      width: 100%;
    }

    .search-container {
      padding: 15px;
      max-width: 800px;
      margin: 0 auto;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--surface);
      border-radius: 30px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
    }

    .search-box:focus-within {
      border-color: #10b981;
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      padding: 12px 20px;
      color: var(--text);
      outline: none;
      font-size: 14px;
    }

    .search-box input::placeholder {
      color: var(--muted);
      opacity: 0.72;
    }

    .search-box button {
      background: transparent;
      border: none;
      color: var(--accent);
      padding: 0 20px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Poloja Notice Bar */
    .notice-container {
      max-width: 800px;
      margin: 0 auto 15px;
      padding: 0 15px;
    }

    .notice-bar {
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7);
      color: #ffffff;
      padding: 9px 14px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
      animation: glowPulse 2s infinite;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s ease;
      text-decoration: none;
    }

    .notice-bar.notice-init {
      animation: slideDown 0.5s ease-out, glowPulse 2s infinite;
    }

    .notice-bar:hover {
      transform: scale(1.01);
    }

    html.dark .notice-bar {
      background: linear-gradient(135deg, #4f46e5, #7c3aed, #9333ea);
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4); }
      50% { box-shadow: 0 8px 34px rgba(139, 92, 246, 0.68); }
    }

    .notice-icon {
      background: rgba(255, 255, 255, 0.2);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      animation: bounceIcon 0.8s ease-in-out infinite;
    }

    @keyframes bounceIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .notice-badge {
      background: rgba(255, 255, 255, 0.25);
      padding: 3px 10px;
      border-radius: 30px;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .notice-content {
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .notice-track {
      display: inline-flex;
      width: max-content;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3px;
      animation: polojaMarquee 12s linear infinite;
      will-change: transform;
    }

    .notice-track span {
      padding-right: 44px;
    }

    @keyframes polojaMarquee {
      0% { transform: translate3d(0%, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }

    .bullhorn-svg {
      width: 16px;
      height: 16px;
      display: block;
      color: #ffffff;
    }

    @media (max-width: 600px) {
      .notice-badge { display: none; }
      .notice-bar { padding: 8px 12px; }
      .notice-icon { width: 28px; height: 28px; }
      .bullhorn-svg { width: 14px; height: 14px; }
      .notice-track { font-size: 11px; animation-duration: 10s; }
    }

    /* Poloja Section Title */
    .section-title {
      padding: 10px 20px 8px;
      font-size: 16px;
      font-weight: 600;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 800px;
      margin: 0 auto;
    }

    /* Poloja Horizontal Lists & Grids */
    .horizontal-list {
      display: flex;
      overflow-x: auto;
      gap: 15px;
      padding: 0 15px 20px;
      scrollbar-width: none;
      max-width: 800px;
      margin: 0 auto;
    }

    .horizontal-list::-webkit-scrollbar {
      display: none;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 15px;
      padding: 0 15px 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    .ai-tools-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
      padding: 0 15px 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    @media (min-width: 600px) {
      .app-grid {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      }
      .ai-tools-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
      }
    }

    @media (min-width: 900px) {
      .ai-tools-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    /* Poloja App / Game Card (Centered Title + Stars + Green Badge) */
    .app-card {
      background: var(--surface);
      padding: 12px;
      border-radius: 20px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 1px solid var(--border);
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
      box-shadow: var(--shadow);
      cursor: pointer;
      width: 100%;
    }

    .app-card:hover {
      border-color: rgba(16, 185, 129, 0.4);
    }

    .app-card:active {
      transform: scale(0.96);
    }

    .horizontal-list .app-card.trend-card {
      min-width: 112px;
      width: 112px;
      flex-shrink: 0;
    }

    @media (min-width: 600px) {
      .horizontal-list .app-card.trend-card {
        min-width: 132px;
        width: 132px;
      }
    }

    .app-icon {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 8px;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: var(--accent);
    }

    .app-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .app-title {
      font-size: 12px;
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 16px;
      text-align: center;
      width: 100%;
      color: var(--text);
    }

    .card-stars {
      margin: 4px 0 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .mod-badge {
      font-size: 9px;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid var(--accent-border);
      margin-top: auto;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      max-width: 100%;
      white-space: nowrap;
    }

    /* Professional 1:1 Square AI Prompt Card (Poloja Style — NO Copy Button on Home) */
    .prompt-card-poloja {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 9px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .prompt-card-poloja:hover {
      transform: translateY(-2px);
      border-color: rgba(139, 92, 246, 0.45);
    }

    .prompt-card-poloja:active {
      transform: scale(0.97);
    }

    .horizontal-list.prompt-home-list {
      gap: 13px;
    }

    .horizontal-list .prompt-card-poloja {
      min-width: 136px;
      width: 136px;
      flex-shrink: 0;
    }

    @media (min-width: 640px) {
      .horizontal-list.prompt-home-list {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        overflow: visible;
        gap: 15px;
      }
      .horizontal-list .prompt-card-poloja {
        min-width: 0;
        width: 100%;
      }
      .ai-tools-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }
    }

    .pop-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(139, 92, 246, 0.95);
      color: #ffffff;
      font-size: 9px;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.3px;
      z-index: 10;
      pointer-events: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
    }

    .prompt-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      overflow: hidden;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8b5cf6;
      font-weight: 700;
    }

    .prompt-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: transform 0.3s ease;
    }

    .prompt-card-poloja:hover .prompt-thumb img {
      transform: scale(1.05);
    }

    .title-wrapper {
      width: 100%;
      padding: 8px 4px 2px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .prompt-title-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.38;
      text-align: center;
      width: 100%;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Exact Poloja.top Details & Popup Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes lbFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes lbZoomIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes modalZoomIn {
      from { transform: scale(0.82); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* Poloja Details View */
    .detail-container {
      padding: 16px 20px 30px;
      max-width: 800px;
      margin: 0 auto;
      animation: fadeIn 0.5s ease;
    }

    .feed-enter {
      animation: lbFadeIn 0.22s ease;
    }

    @media (prefers-reduced-motion: reduce) {
      .detail-container, .feed-enter, .menu-dropdown.show, .overlay.open, .overlay.open .modal-box, .overlay.open #lightboxImg {
        animation: none !important;
      }
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 0;
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1;
      min-height: 36px;
      cursor: pointer;
      padding: 6px 0;
      margin-bottom: 8px;
      transition: color 0.15s ease, transform 0.15s ease;
    }

    .back-btn svg {
      display: block;
      flex-shrink: 0;
    }

    .back-btn span {
      display: inline-block;
      line-height: 1;
    }

    .back-btn:hover {
      color: var(--accent);
    }

    .back-btn:active {
      transform: scale(0.95);
    }

    .detail-heading {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 12px;
      color: var(--text);
    }

    .detail-heading.center-title {
      text-align: center;
    }

    .app-info-box {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 22px;
      background: var(--surface);
      padding: 15px;
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .detail-icon-btn {
      width: 104px;
      height: 104px;
      border-radius: 16px;
      flex-shrink: 0;
      position: relative;
      border: 0;
      background: var(--surface-2);
      cursor: zoom-in;
      overflow: hidden;
      padding: 0;

      } else if (/drive\.google\.com\/uc\?/i.test(url) || /drive\.usercontent\.google\.com\/download/i.test(url)) {
        isDirectBinary = true;
      }

      if (/^https?:\/\/(www\.)?dropbox\.com\//i.test(url)) {
        if (/[?&]dl=0\b/.test(url)) url = url.replace(/([?&])dl=0\b/, "$1dl=1");
        else if (!/[?&]dl=1\b/.test(url)) url += (url.indexOf("?") !== -1 ? "&" : "?") + "dl=1";
        isDirectBinary = true;
      }

      var mfExp = url.match(/^https?:\/\/download\d*\.mediafire\.com\/[^/]+\/([a-zA-Z0-9]+)\/([^?#]+)/i);
      if (mfExp) {
        url = "https://www.mediafire.com/file/" + mfExp[1] + "/" + mfExp[2] + "/file";
        isDirectBinary = false;
      }

      var isMediaFire = /mediafire\.com/i.test(url);
      if (!isDirectBinary && !isMediaFire) {
        if (
          /^https?:\/\/github\.com\/[^/]+\/[^/]+\/(releases\/download|raw)\//i.test(url) ||
          /^https?:\/\/(raw\.githubusercontent\.com|release-assets\.githubusercontent\.com)\//i.test(url) ||
          /^https?:\/\/telegram\.org\/dl\/android\/apk/i.test(url) ||
          /^https?:\/\/cdn\d*\.telesco\.pe\/file\//i.test(url) ||
          /^https?:\/\/res\.ldrescdn\.com\//i.test(url) ||
          /^https?:\/\/(d\.apkpure\.com\/b\/|data\.winudf\.com\/)/i.test(url) ||
          /^https?:\/\/archive\.org\/download\//i.test(url)
        ) {
          isDirectBinary = true;
        } else {
          try {
            var p = new URL(url, window.location.href);
            if (BINARY_EXT_RE.test(p.pathname)) isDirectBinary = true;
          } catch (e) {
            if (BINARY_EXT_RE.test(url.split("?")[0])) isDirectBinary = true;
          }
        }
      }

      var fileName = sanitizeFileBase(itemName) + ".apk";
      try {
        var pu = new URL(url, window.location.href);
        var seg = decodeURIComponent((pu.pathname.split("/").pop() || "")).replace(/\+/g, " ");
        if (BINARY_EXT_RE.test(seg)) fileName = seg;
      } catch (e) {}

      return { url: url, fileName: fileName, isDirectBinary: isDirectBinary };
    }

    function triggerDirectDownload(rawUrl, itemName) {
      var info = resolveDownloadInfo(rawUrl, itemName);
      if (info.url === "#") return info;
      var a = document.createElement("a");
      a.href = info.url;
      a.rel = "noopener noreferrer";
      a.style.display = "none";
      if (info.isDirectBinary) {
        a.setAttribute("download", info.fileName);
      } else {
        var inIframe = false;
        try { inIframe = window.self !== window.top; } catch (e) { inIframe = true; }
        if (inIframe) a.target = "_blank";
      }
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ if (a.parentNode) a.parentNode.removeChild(a); }, 150);
      return info;
    }

    window.openItemBySlug = function(slug) {
      var all = DATA.APPS.concat(DATA.GAMES, DATA.AI_PROMPTS);
      var found = all.find(function(x){ return x.slug === slug; });
      if (!found) return;
      savedScrollY = window.scrollY || document.documentElement.scrollTop || 0;
      stopAndCloseOverlaysSilent();
      modalHistoryPushed = false;
      scrollToInstant(0);
      state.selectedItem = found;
      state.privateUnlocked = false;
      routeDepth += 1;
      pushStateSafe();
      render();
      scrollToInstant(0);
    };

    window.backToMain = function() {
      var restoreY = savedScrollY;
      stopAndCloseOverlaysSilent();
      modalHistoryPushed = false;
      state.selectedItem = null;
      state.privateUnlocked = false;
      render();
      scrollToInstant(restoreY);
      if (routeDepth > 0) {
        routeDepth -= 1;
        ignoreNextPop = true;
        setTimeout(function() { ignoreNextPop = false; }, 300);
        try {
          history.back();
          return;
        } catch (e) {
          ignoreNextPop = false;
        }
      }
      pushStateSafe();
    };

    window.switchTab = function(tab) {
      stopAndCloseOverlaysSilent();
      modalHistoryPushed = false;
      savedScrollY = 0;
      scrollToInstant(0);
      state.tab = tab;
      state.selectedItem = null;
      state.privateUnlocked = false;
      state.search = "";
      routeDepth += 1;
      pushStateSafe();
      render();
      scrollToInstant(0);
    };

          html += '<div style="max-width:800px;margin:20px auto;padding:0 15px;"><div class="desc-box" style="text-align:center;padding:38px 20px;">' +
            '<div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;">No Results Found</div>' +
            '<p style="margin-bottom:14px;">আপনার সার্চ অনুযায়ী কোনো কিছু পাওয়া যায়নি।</p>' +
            '<button type="button" class="btn-poloja btn-dl" style="width:auto;display:inline-flex;padding:8px 18px;font-size:12px;margin:0;" onclick="state.search=\'\';render();">Clear Search</button>' +
          '</div></div>';
        } else {
          if (fApps.length) {
            html += '<div class="section-title">' + ICONS.layers + '<span>Matching Apps (' + fApps.length + ')</span></div><div class="app-grid">' + fApps.map(function(a){ return cardHTML(a, false); }).join("") + '</div>';
          }
          if (fGames.length) {
            html += '<div class="section-title">' + ICONS.flame + '<span>Matching Games (' + fGames.length + ')</span></div><div class="app-grid">' + fGames.map(function(g){ return cardHTML(g, false); }).join("") + '</div>';
          }
          if (fPrompts.length) {
            html += '<div class="section-title">' + ICONS.robot + '<span>Matching AI Prompts (' + fPrompts.length + ')</span></div><div class="ai-tools-grid">' + fPrompts.map(promptCardHTML).join("") + '</div>';
          }
        }
      } else {
        if (state.tab === "home" || state.tab === "prompts") {
          html += '<div class="section-title">' + ICONS.robot + '<span>AI Prompt (' + DATA.AI_PROMPTS.length + ')</span></div>' +
            '<div class="' + (state.tab === "home" ? 'horizontal-list prompt-home-list' : 'ai-tools-grid') + '">' +
              DATA.AI_PROMPTS.map(promptCardHTML).join("") +
            '</div>';
        }
        if (state.tab === "home") {
          html += '<div class="section-title">' + ICONS.trending + '<span>Trending Apps (' + DATA.TRENDING_APPS.length + ')</span></div>' +
            '<div class="horizontal-list">' + DATA.TRENDING_APPS.map(function(a){ return cardHTML(a, true); }).join("") + '</div>';
        }
        if (state.tab === "home" || state.tab === "apps") {
          html += '<div class="section-title">' + ICONS.layers + '<span>Latest Updates (' + DATA.APPS.length + ')</span></div>' +
            '<div class="app-grid">' + DATA.APPS.map(function(a){ return cardHTML(a, false); }).join("") + '</div>';
        }
        if (state.tab === "home" || state.tab === "games") {
          html += '<div class="section-title">' + ICONS.flame + '<span>Games Update (' + DATA.GAMES.length + ')</span></div>' +
            '<div class="app-grid">' + DATA.GAMES.map(function(g){ return cardHTML(g, false); }).join("") + '</div>';
        }
      }

      root.innerHTML = html + '</div>';

      var sInput = document.getElementById("searchInput");
      if (sInput) {
        sInput.addEventListener("input", function(e) {
          var pos = e.target.selectionStart;
          state.search = e.target.value;
          render();
          var nextInput = document.getElementById("searchInput");
          if (nextInput) {
            nextInput.focus();
            try { nextInput.setSelectionRange(pos, pos); } catch (_) {}
          }
        });
      }
      var clearBtn = document.getElementById("clearSearchBtn");
      if (clearBtn) {
        clearBtn.addEventListener("click", function() {
          state.search = "";
          render();
        });
      }
    }

    /* Modals */
    function openModalHTML(inner) {
      pushModalHistoryIfNeeded();
      var box = document.getElementById("modalBox");
      box.innerHTML = '<button type="button" class="modal-close" onclick="closeModal()">✕</button>' + inner;
      document.getElementById("modalOverlay").classList.add("open");
      document.body.style.overflow = "hidden";
    }

    window.closeModal = function() {
      closeOverlaysFromUI();
    };

    window.openQrModal = function() {
      openModalHTML(
        '<h3 style="font-size:15px;font-weight:700;margin-bottom:12px;">Minhaj Apps — Official QR</h3>' +
        '<img src="' + esc(DATA.BRAND_CONFIG.qrScannerImage) + '" alt="QR Scanner" referrerpolicy="no-referrer" style="width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:16px;background:#fff;" />'
      );
    };

    window.openInfoModal = function(key) {
      var info = DATA.FOOTER_INFO_ITEMS.find(function(x){ return x.key === key; });
      if (!info) return;
      var body = info.paragraphs.map(function(p){ return '<p style="font-size:13.5px;line-height:1.65;color:var(--muted);margin-bottom:10px;">' + esc(p) + '</p>'; }).join("");
      if (info.link) {
        body += '<a href="' + esc(info.link.url) + '" target="_blank" rel="noopener noreferrer" style="color:var(--accent);font-weight:700;font-size:13.5px;text-decoration:none;">' + esc(info.link.label) + ' ↗</a>';
      }
      openModalHTML('<h3 style="font-size:18px;font-weight:700;margin-bottom:12px;">' + esc(info.title) + '</h3>' + body);
    };

    window.openTutorialModal = function(slug) {
      var all = DATA.APPS.concat(DATA.GAMES);
      var item = all.find(function(x){ return x.slug === slug; });
      var name = item ? item.name : "App";
      var videoSrc = (item && item.tutorialVideoUrl) || DATA.BRAND_CONFIG.defaultTutorialVideoUrl;
      openModalHTML(
        '<h3 style="font-size:16px;font-weight:700;margin-bottom:12px;">Install Problem Fix Tutorial</h3>' +
        '<video controls playsinline preload="metadata" controlslist="nodownload nofullscreen noremoteplayback" disablepictureinpicture style="width:100%;aspect-ratio:9/16;max-height:64vh;border-radius:16px;background:#000;object-fit:contain;" onerror="this.style.display=\'none\';document.getElementById(\x27tutFallback\x27).style.display=\'block\';">' +
          '<source src="' + esc(videoSrc) + '" type="video/mp4" />' +
        '</video>' +
        '<div id="tutFallback" style="display:none;background:var(--surface-3);border:1px solid var(--border);border-radius:16px;padding:14px;">' +
          '<p style="font-weight:700;font-size:13.5px;margin-bottom:8px;">' + esc(name) + ' ইনস্টল করার সঠিক নিয়ম:</p>' +
          '<ol style="padding-left:18px;font-size:13px;line-height:1.6;color:var(--muted);">' +
            '<li style="margin-bottom:6px;">আগের পুরনো ভার্সনের অ্যাপটি প্রথমে Uninstall করুন।</li>' +
            '<li style="margin-bottom:6px;">ফাইলটি ওপেন করে ব্রাউজার বা File Manager-এ Install Unknown Apps অন করুন।</li>' +
            '<li>Play Protect পপআপ এলে More details → Install anyway চাপুন।</li>' +
          '</ol>' +
        '</div>'
      );
    };

    window.openPrivateLoginModal = function() {
      openModalHTML(
        '<div style="text-align:center;">' +
          '<div style="width:54px;height:54px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;">' + ICONS.lock + '</div>' +
          '<h3 style="font-size:19px;font-weight:700;margin-bottom:4px;">Private Vault Login</h3>' +
          '<p style="font-size:12.5px;color:var(--muted);line-height:1.55;margin-bottom:16px;">প্রাইভেট QR কোড ও প্রিসেট আনলক করতে আপনার গোপন Access Key লিখুন।</p>' +
          '<form onsubmit="submitPrivateKey(event)">' +
            '<div class="key-field-wrap">' +
              '<input type="password" id="privKeyInput" class="key-input" placeholder="Enter Access Key" autocomplete="off" />' +
              '<button type="button" class="eye-btn" onclick="toggleKeyVis()" aria-label="Toggle key visibility">' + ICONS.eye + '</button>' +
            '</div>' +
            '<button type="submit" class="btn-poloja btn-dl" style="min-height:46px;border-radius:14px;font-size:14px;margin:0;">Unlock Private Vault</button>' +
          '</form>' +
          '<div id="privErr" style="color:#f43f5e;font-size:12px;font-weight:600;margin-top:10px;min-height:18px;"></div>' +
        '</div>'
      );
    };

    window.toggleKeyVis = function() {
      var inp = document.getElementById("privKeyInput");
      if (inp) inp.type = inp.type === "password" ? "text" : "password";
    };

    window.submitPrivateKey = function(e) {
      e.preventDefault();
      var inp = document.getElementById("privKeyInput");
      var err = document.getElementById("privErr");
      var val = (inp ? inp.value : "").trim();
      if (!val) { err.textContent = "অনুগ্রহ করে আপনার Access Key লিখুন।"; return; }
      if (val === DATA.BRAND_CONFIG.privateAccessKey) {
        savedScrollY = window.scrollY || document.documentElement.scrollTop || 0;
        stopAndCloseOverlaysSilent();
        scrollToInstant(0);
        state.privateUnlocked = true;
        state.selectedItem = null;
        routeDepth += 1;
        if (modalHistoryPushed) {
          modalHistoryPushed = false;
          replaceStateSafe();
        } else {
          pushStateSafe();
        }
        render();
        scrollToInstant(0);
      } else {
        err.textContent = "ভুল Access Key দেওয়া হয়েছে।";
        inp.value = "";
      }
    };

    window.openPrivateDlConfirm = function(id) {
      var res = DATA.PRIVATE_RESOURCES.find(function(r){ return r.id === id; });
      if (!res) return;
      openModalHTML(
        '<div style="text-align:center;">' +
          '<div style="width:48px;height:48px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;">' + ICONS.dlBtn + '</div>' +
          '<h3 style="font-size:18px;font-weight:700;margin-bottom:4px;">' + esc(res.title) + '</h3>' +
          '<div style="font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:10px;">Ready to Download via Google Drive</div>' +
          '<p style="font-size:13px;line-height:1.6;color:var(--muted);margin-bottom:18px;">' + esc(res.description) + '</p>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">' +
            '<button type="button" class="btn-poloja btn-tut" style="min-height:44px;border-radius:12px;font-size:13px;margin:0;" onclick="closeModal()">Cancel</button>' +
            '<a href="' + esc(resolveDownloadInfo(res.downloadUrl, res.title).url) + '" class="btn-poloja btn-dl" style="min-height:44px;border-radius:12px;font-size:13px;margin:0;" onclick="return startPrivateDownload(\'' + esc(res.id) + '\', event)">' + ICONS.dlBtn + '<span>Download Now</span></a>' +
          '</div>' +
        '</div>'
      );
    };

    /* Init Wire-up */
    (function init() {
      syncThemeIcon();

      document.getElementById("themeBtn").addEventListener("click", function() {
        var dark = !document.documentElement.classList.contains("dark");
        document.documentElement.classList.toggle("dark", dark);
        try { localStorage.setItem("minhaj_theme", dark ? "dark" : "light"); } catch (e) {}
        syncThemeIcon();
      });

      document.getElementById("brandHomeBtn").addEventListener("click", function() {
        switchTab("home");
      });

      var menuBtn = document.getElementById("menuBtn");
      var menuDropdown = document.getElementById("menuDropdown");
      var menuContainer = document.getElementById("menuContainer");

      function closeDropdown() {
        menuDropdown.classList.remove("show");
        menuBtn.classList.remove("active");
      }

      menuBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        var open = menuDropdown.classList.toggle("show");
        menuBtn.classList.toggle("active", open);
      });

      document.addEventListener("click", function(e) {
        if (menuContainer && !menuContainer.contains(e.target)) {
          closeDropdown();
        }
      });

      document.getElementById("openQrBtn").addEventListener("click", function() {
        closeDropdown();
        openQrModal();
      });

      document.getElementById("openPrivateLoginBtn").addEventListener("click", function() {
        closeDropdown();
        openPrivateLoginModal();
      });

      document.querySelectorAll("[data-tab]").forEach(function(btn) {
        btn.addEventListener("click", function() {
          closeDropdown();
          switchTab(btn.getAttribute("data-tab"));
        });
      });

      document.getElementById("menuSocialItems").innerHTML = DATA.SOCIAL_LINKS.map(function(s) {
        var label = s.name === "Telegram" ? "Join Telegram" : s.name;
        return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer" class="menu-item">' +
          '<span class="menu-icon-slot">' + socialBrandSvg(s.name) + '</span>' +
          '<span>' + esc(label) + '</span>' +
        '</a>';
      }).join("");

      document.getElementById("footerLinks").innerHTML = DATA.FOOTER_INFO_ITEMS.map(function(f) {
        return '<button type="button" onclick="openInfoModal(\'' + esc(f.key) + '\')">' + esc(f.label) + '</button><span>|</span>';
      }).join("") + '<a href="' + esc(DATA.BRAND_CONFIG.telegramUrl) + '" target="_blank" rel="noopener noreferrer">Telegram</a>';

      document.getElementById("modalOverlay").addEventListener("click", closeModal);
      document.getElementById("lightboxOverlay").addEventListener("click", closeLightbox);

      document.addEventListener("keydown", function(e) {
        if (e.key === "Escape" && isAnyOverlayOpen()) {
          closeOverlaysFromUI();
        }
      });

      replaceStateSafe();

      window.addEventListener("popstate", function(e) {
        if (ignoreNextPop) {
          ignoreNextPop = false;
          return;
        }
        if (isAnyOverlayOpen()) {
          modalHistoryPushed = false;
          stopAndCloseOverlaysSilent();
          return;
        }
        closeDropdown();
        var st = e.state || {};
        state.tab = st.tab || "home";
        state.privateUnlocked = Boolean(st.priv);
        if (st.slug) {
          var all = DATA.APPS.concat(DATA.GAMES, DATA.AI_PROMPTS);
          state.selectedItem = all.find(function(x){ return x.slug === st.slug; }) || null;
        } else {
          state.selectedItem = null;
        }
        if (routeDepth > 0) routeDepth -= 1;
        render();
        if (!state.selectedItem && !state.privateUnlocked) {
          scrollToInstant(savedScrollY);
        } else {
          scrollToInstant(0);
        }
      });

      render();
    })();
  </script>
</body>
</html>
