      min-height: 42px;
      border-radius: 12px;
      font-size: 13.4px;
    }

    .key-field-wrap {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }

    .key-input {
      width: 100%;
      height: 44px;
      padding: 0 36px 0 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-3);
      color: var(--text);
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(11px, 3.1vw, 13px);
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      outline: 0;
      transition: border-color 0.2s ease;
    }

    .key-input::placeholder {
      text-transform: none;
      letter-spacing: 0;
      font-weight: 500;
      color: var(--muted);
      opacity: 0.72;
    }

    .key-input:focus { border-color: #10b981; }

    .key-clear-btn {
      position: absolute;
      right: 5px;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
    }

    .key-clear-btn.show {
      display: flex;
    }

    .key-helper-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .key-helper-btn {
      height: 37px;
      min-height: 37px;
      padding: 0 10px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 600;
      margin: 0;
      gap: 6px;
      white-space: nowrap;
    }

    @media (max-width: 359px) {
      .bottom-nav {
        width: calc(100% - 20px);
        padding: 6px 4px;
      }
      .nav-item {
        padding: 5px 4px;
      }
      .btn-modal {
        height: 36px;
        min-height: 36px;
        padding: 0 8px;
        font-size: 11.8px;
        gap: 5px;
      }
      .key-helper-btn {
        font-size: 11.5px;
        padding: 0 6px;
      }
    }

    @media (max-height: 520px) {
      .modal-box {
        max-height: calc(100dvh - 24px);
        padding: 16px;
      }
      .bottom-nav {
        bottom: 8px;
        padding: 5px 6px;
      }
      .nav-item {
        min-height: 40px;
        padding: 4px 8px;
      }
    }

    .vault-session-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 14px;
      padding: 11px 15px;
      margin-bottom: 16px;
      border-radius: 15px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      font-size: clamp(11.2px, 3vw, 12.5px);
    }

    .vault-timer-num {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--accent);
    }

    .vault-timer-num.expiring {
      color: #f59e0b;
    }

    .toast {
      position: fixed;
      bottom: calc(82px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 3000;
      max-width: calc(100vw - 28px);
      background: #1e293b;
      color: #ffffff;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      display: none;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.show { display: inline-flex; }</style>
