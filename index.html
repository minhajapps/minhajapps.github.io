  <script>
    (function () {
      try {
        var saved = localStorage.getItem('minhaj_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
        var params = new URLSearchParams(window.location.search);
        var redirected = params.get('r') || sessionStorage.getItem('minhaj_spa_redirect');
        if (redirected) {
          try { sessionStorage.removeItem('minhaj_spa_redirect'); } catch (e) {}
          if (redirected.charAt(0) === '/' && redirected.indexOf('//') !== 0) {
            history.replaceState(history.state, '', redirected);
          }
        }
      } catch (e) {}
    })();
  </script>

  <style>
    :root {
      --bg: #f8f9fc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --surface-3: #f8f9fc;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #5b6e8c;
      --accent: #10b981;
      --accent-soft: rgba(16, 185, 129, 0.1);
      --accent-border: rgba(16, 185, 129, 0.22);
      --star-empty: #cbd5e1;
      --shadow: 0 2px 8px rgba(15, 23, 42, 0.045);
      --shadow-hover: 0 8px 20px rgba(15, 23, 42, 0.08);
      --header-bg: rgba(255, 255, 255, 0.92);
      --nav-bg: rgba(255, 255, 255, 0.94);
      --page-max: 800px;
      --side-pad: clamp(12px, 3.8vw, 20px);
    }

    @media (min-width: 768px) {
      :root { --page-max: 900px; }
    }

    @media (min-width: 1024px) {
      :root { --page-max: 1060px; }
    }

    @media (min-width: 1280px) {
      :root { --page-max: 1140px; }
    }

    html.dark {
      --bg: #0f1216;
      --surface: #1a1f26;
      --surface-2: #252b35;
      --surface-3: #12161c;
      --border: rgba(255, 255, 255, 0.06);
      --text: #ffffff;
      --muted: #a0a6b1;
      --accent: #00ff88;
      --accent-soft: rgba(0, 255, 136, 0.1);
      --accent-border: rgba(0, 255, 136, 0.2);
      --star-empty: #475569;
      --shadow: 0 3px 12px rgba(0, 0, 0, 0.22);
      --shadow-hover: 0 10px 24px rgba(0, 0, 0, 0.34);
      --header-bg: rgba(26, 31, 38, 0.92);
      --nav-bg: rgba(26, 31, 38, 0.94);
      color-scheme: dark;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Noto Sans Bengali', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--bg);
      min-height: 100%;
      overflow-x: clip;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: calc(124px + env(safe-area-inset-bottom, 0px));
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      overflow-x: clip;
      display: flex;
      flex-direction: column;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    img, svg {
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      pointer-events: none;
    }

    a, button {
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    a[href] {
      -webkit-touch-callout: default;
      -webkit-user-drag: none;
    }

    button, input, textarea {
      font-family: inherit;
    }

    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Poloja Header */
    .app-header {
      background: var(--header-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: calc(12px + env(safe-area-inset-top, 0px)) max(var(--side-pad), env(safe-area-inset-right, 0px)) 12px max(var(--side-pad), env(safe-area-inset-left, 0px));
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .header-inner {
      width: 100%;
      max-width: var(--page-max);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
    }

    .logo-link {
      display: flex;
      align-items: center;
      gap: clamp(8px, 2.4vw, 12px);
      background: none;
      border: 0;
      padding: 2px 0;
      cursor: pointer;
      text-decoration: none;
      text-align: left;
      white-space: nowrap;
      flex-shrink: 1;
      min-width: 0;
      color: var(--text);
    }

    .logo-img {
      width: clamp(30px, 8.5vw, 34px);
      height: clamp(30px, 8.5vw, 34px);
      border-radius: 50%;
      border: 2px solid #10b981;
      object-fit: cover;
      display: block;
      flex-shrink: 0;
      background: var(--surface-2);
    }

    .logo-text {
      font-size: clamp(14.5px, 4.3vw, 18px);
      font-weight: 700;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
      letter-spacing: 0.2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: clamp(8px, 2.5vw, 13px);
      flex-shrink: 0;
    }

    .theme-toggle, .menu-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      width: clamp(36px, 9.6vw, 40px);
      height: clamp(36px, 9.6vw, 40px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    html.dark .theme-toggle,
    html.dark .menu-btn {
      border-color: rgba(255, 255, 255, 0.09);
    }

    .theme-toggle:hover, .theme-toggle:focus,
    .menu-btn:hover, .menu-btn:focus {
      outline: none;
    }

    .theme-toggle:active, .menu-btn:active {
      transform: scale(0.94);
    }

    .menu-btn.active {
      background: #10b981;
      border-color: #10b981;
      color: #ffffff;
    }

    .telegram-icon {
      background: linear-gradient(135deg, #0088cc, #00aaff);
      width: clamp(36px, 9.6vw, 40px);
      height: clamp(36px, 9.6vw, 40px);
      flex-shrink: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      box-shadow: 0 0 8px rgba(0, 136, 204, 0.5);
      animation: pulseGlow 1.8s infinite ease-in-out;
      transition: transform 0.25s;
    }

    .telegram-icon:hover {
      transform: scale(1.08);
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(0, 136, 204, 0.6); }
      50% { box-shadow: 0 0 0 8px rgba(0, 136, 204, 0.2); }
      100% { box-shadow: 0 0 0 0 rgba(0, 136, 204, 0); }
    }

    /* Poloja Menu Dropdown */
    .menu-container {
      position: relative;
    }

    .menu-dropdown {
      position: absolute;
      top: 50px;
      right: 0;
      background: var(--surface);
      border-radius: 20px;
      border: 1px solid var(--border);
      min-width: min(236px, calc(100vw - 24px));
      max-width: calc(100vw - 24px);
      max-height: min(calc(100vh - 80px), calc(100dvh - 80px));
      overflow-y: auto;
      overscroll-behavior: contain;
      box-shadow: 0 20px 38px rgba(15, 23, 42, 0.14);
      z-index: 1001;
      display: none;
    }

    html.dark .menu-dropdown {
      box-shadow: 0 22px 44px rgba(0, 0, 0, 0.48);
    }

    .menu-dropdown.show {
      display: block;
      transform-origin: top right;
      animation: modalZoomIn 0.2s ease-out;
    }

    .menu-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 12.5px 18px;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border);
      outline: none;
      color: var(--text);
      text-decoration: none;
      font-size: 13.8px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, padding-left 0.2s, color 0.2s;
      text-align: left;
      white-space: nowrap;
    }

    .menu-item:hover {
      background: var(--surface-2);
      padding-left: 22px;
    }

    html.dark .menu-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .menu-item:focus,
    .menu-item:focus-visible,
    .menu-item:active {
      outline: none;
      border-bottom-color: var(--border);
    }

    #menuSocialItems .menu-item:last-child {
      border-bottom: 0;
    }

    .menu-item.active {
      color: var(--accent);
      font-weight: 600;
      background: var(--accent-soft);
    }

    .menu-icon-slot {
      width: 21px;
      height: 21px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .menu-footer {
      padding: 11px 16px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      border-top: 1px solid var(--border);
    }

    /* Main Page Content */
    .page-content {
      flex: 1;
      width: 100%;
    }

    .search-container {
      padding: 14px var(--side-pad);
      width: 100%;
      max-width: var(--page-max);
      margin: 0 auto;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--surface);
      border-radius: 30px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
    }

    .search-box:focus-within {
      border-color: #10b981;
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      padding: 12px 18px;
      color: var(--text);
      outline: none;
      font-size: 14px;
    }

    .search-box input::placeholder {
      color: var(--muted);
      opacity: 0.72;
    }

    .search-box button {
      background: transparent;
      border: none;
      color: var(--accent);
      padding: 0 18px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Poloja Notice Bar */
    .notice-container {
      width: 100%;
      max-width: var(--page-max);
      margin: 0 auto 14px;
      padding: 0 var(--side-pad);
    }

    .notice-bar {
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7);
      color: #ffffff;
      padding: 9px 14px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
      animation: glowPulse 2s infinite;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s ease;
      text-decoration: none;
      outline: none;
    }

    .notice-bar.notice-init {
      animation: slideDown 0.5s ease-out, glowPulse 2s infinite;
    }

    .notice-bar:hover {
      transform: scale(1.01);
    }

    html.dark .notice-bar {
      background: linear-gradient(135deg, #4f46e5, #7c3aed, #9333ea);
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4); }
      50% { box-shadow: 0 8px 34px rgba(139, 92, 246, 0.68); }
    }

    .notice-icon {
      background: rgba(255, 255, 255, 0.2);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      animation: bounceIcon 0.8s ease-in-out infinite;
    }

    @keyframes bounceIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .notice-badge {
      background: rgba(255, 255, 255, 0.25);
      padding: 3px 10px;
      border-radius: 30px;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .notice-content {
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .notice-track {
      display: inline-flex;
      width: max-content;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3px;
      animation: polojaMarquee 12s linear infinite;
      will-change: transform;
    }

    .notice-track span {
      padding-right: 44px;
    }

    @keyframes polojaMarquee {
      0% { transform: translate3d(0%, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }

    .bullhorn-svg {
      width: 16px;
      height: 16px;
      display: block;
      color: #ffffff;
    }

    @media (max-width: 600px) {
      .notice-badge { display: none; }
      .notice-bar { padding: 8px 12px; }
      .notice-icon { width: 28px; height: 28px; }
      .bullhorn-svg { width: 14px; height: 14px; }
      .notice-track { font-size: 11px; animation-duration: 10s; }
    }

    /* Poloja Section Title */
    .section-title {
      padding: 10px var(--side-pad) 8px;
      font-size: clamp(14.5px, 4vw, 16.5px);
      font-weight: 600;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: var(--page-max);
      margin: 0 auto;
    }

    /* Poloja Horizontal Lists & Grids */
    .horizontal-list {
      display: flex;
      overflow-x: auto;
      gap: clamp(11px, 3vw, 15px);
      padding: 0 var(--side-pad) 20px;
      scrollbar-width: none;
      width: 100%;
      max-width: var(--page-max);
      margin: 0 auto;
      -webkit-overflow-scrolling: touch;
    }

    .horizontal-list::-webkit-scrollbar {
      display: none;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(10px, 3.2vw, 15px);
      padding: 0 var(--side-pad) 20px;
      width: 100%;
      max-width: var(--page-max);
      margin: 0 auto;
    }

    .ai-tools-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(10px, 3.2vw, 15px);
      padding: 0 var(--side-pad) 20px;
      width: 100%;
      max-width: var(--page-max);
      margin: 0 auto;
    }

    /* Poloja App / Game Card (Centered Title + Stars + Green Badge) */
    .app-card {
      background: var(--surface);
      padding: clamp(9px, 2.8vw, 12px);
      border-radius: clamp(16px, 4.5vw, 20px);
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 1px solid var(--border);
      outline: none;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: var(--shadow);
      cursor: pointer;
      width: 100%;
      min-width: 0;
    }

    .app-card:hover,
    .app-card:focus,
    .app-card:focus-visible,
    .app-card:active {
      outline: none;
      border-color: var(--border);
    }

    @media (hover: hover) {
      .app-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-hover);
      }
    }

    .app-card:active {
      transform: scale(0.96);
    }

    .horizontal-list .app-card.trend-card {
      min-width: clamp(104px, 28vw, 114px);
      width: clamp(104px, 28vw, 114px);
      flex-shrink: 0;
    }

    .app-icon {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: clamp(13px, 3.8vw, 16px);
      overflow: hidden;
      margin-bottom: 8px;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: var(--accent);
    }

    .app-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .app-title {
      font-size: clamp(11px, 3.1vw, 12.2px);
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 16px;
      text-align: center;
      width: 100%;
      color: var(--text);
    }

    .card-stars {
      margin: 4px 0 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .mod-badge {
      font-size: clamp(8.5px, 2.4vw, 9.2px);
      background: var(--accent-soft);
      color: var(--accent);
      padding: 2px 7.5px;
      border-radius: 20px;
      border: 1px solid var(--accent-border);
      margin-top: auto;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Professional 1:1 Square AI Prompt Card (Poloja Style — NO Copy Button on Home) */
    .prompt-card-poloja {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      outline: none;
      border-radius: clamp(16px, 4.5vw, 20px);
      padding: clamp(8px, 2.5vw, 10px);
      box-shadow: var(--shadow);
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .prompt-card-poloja:hover,
    .prompt-card-poloja:focus,
    .prompt-card-poloja:focus-visible,
    .prompt-card-poloja:active {
      outline: none;
      border-color: var(--border);

        gap: 16px;

        width: 132px;

    @media (min-width: 640px) {

    /* Exact Poloja.top Details & Popup Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes lbFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes lbZoomIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes modalZoomIn {
      from { transform: scale(0.82); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* Poloja Details View */

      margin: 0 auto;

    }

    }

    @media (prefers-reduced-motion: reduce) {
      .detail-container, .feed-enter, .menu-dropdown.show, .overlay.open, .overlay.open .modal-box, .overlay.open #lightboxImg {
        animation: none !important;
      }
    }

    .back-btn {

      background: none;

      outline: none;

    .detail-heading {

    .app-info-box {

      align-items: center;

      border: 0;
      outline: none;
      background: var(--surface-2);

      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .detail-icon-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .zoom-badge {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.55);
      color: #ffffff;
      padding: 3px 5px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .info-table {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: clamp(11.8px, 3.2vw, 13.3px);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 5px;
    }

    .info-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .info-label { color: var(--muted); flex-shrink: 0; }
    .info-val { font-weight: 600; color: var(--text); text-align: right; word-break: break-word; min-width: 0; }
    .info-val.green { color: var(--accent); }

    .desc-box {
      background: var(--surface);
      padding: clamp(13px, 3.8vw, 16px);
      border-radius: 18px;
      margin-bottom: 16px;
      font-size: clamp(12.8px, 3.4vw, 13.5px);
      line-height: 1.62;
      color: var(--muted);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      word-break: break-word;
    }

    .desc-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .prompt-text-box {
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      color: var(--text);
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;

      -webkit-user-select: text;
    }

    .play-store {
      background: var(--surface);
      border: 1px solid var(--border);
      outline: none;
      padding: 11px 16px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      text-decoration: none;
      color: var(--text);
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .play-store-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .play-store-arrow {
      color: var(--muted);
      opacity: 0.7;
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }

    .play-store:hover,
    .play-store:focus,
    .play-store:focus-visible,
    .play-store:active {
      outline: none;
      border-color: var(--border);
    }

    .play-store:active {
      transform: scale(0.985);
    }

    .btn-poloja {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 46px;
      min-height: 46px;
      padding: 0 16px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 600;
      font-size: clamp(13.4px, 3.6vw, 14.5px);
      margin-bottom: 10px;
      gap: 8px;
      white-space: nowrap;
      transition: transform 0.18s ease, filter 0.18s ease, background 0.18s ease;

      border: none;
      outline: none;

    @media (hover: hover) {
      .btn-poloja:hover { transform: translateY(-1.5px); }
    }
    .btn-poloja:active { transform: scale(0.985); }
    .btn-dl { background: #10b981; color: #ffffff; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.22); }
    @keyframes dlSpin { to { transform: rotate(360deg); } }
    .dl-spin { animation: dlSpin 0.8s linear infinite; }
    .btn-tg { background: #3b82f6; color: #ffffff; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.2); }
    .btn-copy { background: #364661; color: #ffffff; }
    .btn-copy.copied { background: #10b981; }
    .btn-tut {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: clamp(13px, 3.4vw, 13.8px);
      box-shadow: var(--shadow);
    }

    .btn-tut:hover,
    .btn-tut:focus,
    .btn-tut:focus-visible,
    .btn-tut:active {
      outline: none;
      border-color: var(--border);
    }

    .rating-box {
      text-align: center;
      margin-top: 20px;
      padding: 18px 16px;
      background: var(--surface);
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    /* Private Vault */
    .vault-wrap {
      padding: 15px var(--side-pad) 26px;
      width: 100%;
      max-width: var(--page-max);
      margin: 0 auto;
      animation: fadeIn 0.5s ease;
    }

    .vault-top {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .lock-btn {
      min-height: 36px;
      padding: 6px 12px;
      border-radius: 11px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      outline: none;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: transform 0.16s ease, background 0.16s ease;

    .lock-btn:focus-visible,

    .vault-header {
      padding-bottom: 16px;

      display: flex;
      flex-wrap: wrap;
      align-items: center;

      gap: 10px 16px;

    .vault-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    @media (min-width: 640px) {
      .vault-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    }

    @media (min-width: 1024px) {
      .vault-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    }

    .vault-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: clamp(14px, 3.8vw, 17px);
      box-shadow: var(--shadow);

      flex-direction: column;
      min-width: 0;
    }

    .vault-icon-box {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .hud-code-bar {
      margin-bottom: 12px;
      padding: 7px 10px;
      border-radius: 11px;
      background: var(--surface-3);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .hud-code-bar code {
      font-size: 11.8px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      user-select: text;
    }

    .vault-card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: auto;
    }

    .btn-vault-preview {
      height: 39px;
      min-height: 39px;
      padding: 0 13px;
      border-radius: 11px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      outline: none;
      color: var(--text);
      font-size: 12.2px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.16s ease;
    }

    .btn-vault-preview:hover,
    .btn-vault-preview:focus,
    .btn-vault-preview:focus-visible,
    .btn-vault-preview:active {
      outline: none;
      border-color: var(--border);
    }

    .btn-vault-preview:active {
      transform: scale(0.97);
    }

    .btn-vault-dl {
      flex: 1;
      height: 39px;
      min-height: 39px;
      padding: 0 14px;
      border-radius: 11px;
      background: #10b981;
      color: #ffffff;
      border: 0;
      outline: none;
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(16, 185, 129, 0.2);
      transition: transform 0.16s ease, opacity 0.16s ease;
    }

    .btn-vault-dl:active {
      transform: scale(0.97);
    }

    /* Poloja Footer */
    .footer-links {
      text-align: center;
      width: 100%;
      max-width: var(--page-max);
      margin: 12px auto 0;
      padding: 18px var(--side-pad) 10px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    .footer-links .links {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4px 6px;
    }

    .footer-links button, .footer-links a {
      background: none;
      border: 0;
      outline: none;
      color: var(--muted);
      font-size: 12px;
      padding: 4px 5px;
      display: inline-block;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .footer-links button:hover, .footer-links a:hover {
      color: var(--accent);
    }

    /* Poloja Floating Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: min(92%, 500px);
      background: var(--nav-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      padding: 7px 6px;
      border-radius: 30px;
      border: 1px solid var(--border);
      z-index: 999;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);

      border-color: rgba(255, 255, 255, 0.07);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.36);

    .nav-item {
      flex: 1 1 0;
      min-width: 0;
      min-height: 46px;
      background: transparent;
      border: 0;
      outline: none;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 10px;
      gap: 4px;
      padding: 6px 8px;
      border-radius: 25px;

      white-space: nowrap;
      transition: background 0.25s, color 0.25s, box-shadow 0.25s;

    .nav-item span {
      font-size: clamp(10px, 2.8vw, 11px);
      font-weight: 500;
      line-height: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .nav-item.active {
      background: #10b981;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    html.dark .nav-item.active {
      background: #00ff88;
      color: #0f1216;
      box-shadow: 0 4px 14px rgba(0, 255, 136, 0.26);
    }

    html.dark .nav-item.active span {
      font-weight: 600;
    }

    /* Modals & Lightbox */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(2, 6, 23, 0.68);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
    }

    .overlay.open {
      display: flex;
      animation: lbFadeIn 0.2s ease;
    }

    .overlay.open .modal-box {
      animation: modalZoomIn 0.24s cubic-bezier(0.34, 1.45, 0.64, 1);
    }

    .overlay.open #lightboxImg {
      animation: lbZoomIn 0.24s cubic-bezier(0.34, 1.45, 0.64, 1);
    }

    .modal-box {
      position: relative;
      width: 100%;
      max-width: min(370px, 100%);
      max-height: min(88vh, 88dvh);
      overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: clamp(18px, 4.8vw, 22px);

    .modal-close {
      position: absolute;
      top: 13px;
      right: 13px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.16s ease;
    }

    .modal-close:active {
      transform: scale(0.92);
    }

    .modal-icon-badge {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
    }

    .modal-title {

      font-weight: 700;
      line-height: 1.3;
      color: var(--text);
      margin-bottom: 3px;
      padding: 0 22px;

    .modal-sub {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 12.6px;
      line-height: 1.58;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .modal-action-row {
      display: grid;
      grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
      gap: 8px;
      align-items: center;
    }

    .btn-modal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 38px;
      min-height: 38px;
      padding: 0 11px;
      border-radius: 11px;
      font-size: 12.4px;
      font-weight: 600;
      line-height: 1;
      gap: 6px;
      white-space: nowrap;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      outline: none;
      margin: 0;
      transition: transform 0.16s ease, background 0.16s ease, opacity 0.16s ease;

    .btn-modal svg {

    }

    .btn-modal:hover,
    .btn-modal:focus,
    .btn-modal:focus-visible,
    .btn-modal:active {
      outline: none;
    }

    .btn-modal:active {
      transform: scale(0.97);
    }

    .btn-modal-cancel {

        return null;
      }
    }

    function isSessionPrivUnlocked() {
      return Boolean(getActiveVaultSession());
    }

    function stopVaultSecurityGuard() {
      if (vaultTickTimer) {
        clearInterval(vaultTickTimer);
        vaultTickTimer = null;
      }
      if (vaultRemoteHeartbeatTimer) {
        clearInterval(vaultRemoteHeartbeatTimer);
        vaultRemoteHeartbeatTimer = null;
      }
    }

    function setSessionPrivUnlocked(unlocked, sessionObj) {
      try {
        if (unlocked && sessionObj) {
          sessionStorage.setItem(VAULT_SESSION_STORAGE_KEY, JSON.stringify(sessionObj));
          startVaultSecurityGuard();
        } else {
          sessionStorage.removeItem(VAULT_SESSION_STORAGE_KEY);
          stopVaultSecurityGuard();
        }
      } catch (e) {
        if (!unlocked) stopVaultSecurityGuard();
      }
    }

    function fsStr(field) {
      return field && typeof field.stringValue === "string" ? field.stringValue : "";
    }

    function fsInt(field, fallback) {
      if (!field) return fallback;
      var n = Number(field.integerValue !== undefined ? field.integerValue : field.doubleValue);
      return Number.isFinite(n) ? Math.trunc(n) : fallback;
    }

    function fsTimeMs(field) {
      if (!field || typeof field.timestampValue !== "string") return NaN;
      return Date.parse(field.timestampValue);
    }

    async function verifyKeyAgainstFirestore(rawInput, opts) {
      var options = opts || {};
      var keyCode = extractMinhajKeyCode(rawInput);
      if (!keyCode) {
        return { ok: false, code: "empty", message: "অনুগ্রহ করে আপনার Access Key লিখুন।" };
      }
      if (!VALID_MINHAJ_KEY_RE.test(keyCode)) {
        return { ok: false, code: "format", message: "সঠিক Access Key ফরম্যাট দিন (যেমন: MINHAJ-AFRAD-XXXX-XXXX-XXXX)।" };
      }
      var deviceId = await getMinhajDeviceId();
      var keyDocName = FREE_KEY_DB_DOC_ROOT + "/licenseKeys/" + keyCode;
      var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
      var timeoutId = controller ? setTimeout(function() { try { controller.abort(); } catch (e) {} }, 10000) : null;
      var resp, payload;
      try {
        resp = await fetch(FREE_KEY_BATCH_GET_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          cache: "no-store",
          signal: controller ? controller.signal : undefined,
          body: JSON.stringify({ documents: [keyDocName] })
        });
        var hdrDate = resp.headers ? resp.headers.get("date") : null;
        if (hdrDate) {
          var parsedHdr = Date.parse(hdrDate);
          if (Number.isFinite(parsedHdr)) updateServerClockAnchor(parsedHdr);
        }
        if (!resp.ok) {
          return { ok: false, code: "network_error", message: "Key সার্ভারের সাথে সংযোগ করা যায়নি। আবার চেষ্টা করুন।" };
        }
        payload = await resp.json();
      } catch (err) {
        return { ok: false, code: "network_error", message: "ইন্টারনেট সংযোগ পরীক্ষা করুন। Key যাচাই করতে অনলাইন সংযোগ প্রয়োজন।" };
      } finally {
        if (timeoutId) clearTimeout(timeoutId);
      }
      if (!Array.isArray(payload)) {
        return { ok: false, code: "network_error", message: "সার্ভার থেকে সঠিক তথ্য পাওয়া যায়নি। আবার চেষ্টা করুন।" };
      }
      var foundKeyDoc = null;
      for (var i = 0; i < payload.length; i += 1) {
        var row = payload[i];
        if (row && typeof row.readTime === "string") {
          var rtMs = Date.parse(row.readTime);
          if (Number.isFinite(rtMs)) updateServerClockAnchor(rtMs);
        }
        if (row && row.found && row.found.name === keyDocName) {
          foundKeyDoc = row.found;
        }
      }
      if (!foundKeyDoc || !foundKeyDoc.fields) {
        return { ok: false, code: "not_found", message: "এই Key-টি সঠিক নয় বা ডাটাবেসে পাওয়া যায়নি। Key Generator থেকে বৈধ Key নিন।" };
      }
      var f = foundKeyDoc.fields;
      var storedCode = fsStr(f.keyCode) || keyCode;
      if (storedCode !== keyCode) {
        return { ok: false, code: "not_found", message: "এই Key-টি বৈধ নয়।" };
      }
      var storedStatus = fsStr(f.status) || "active";
      if (storedStatus === "revoked") {
        return { ok: false, code: "revoked", message: "এই Key-টি অ্যাডমিন কর্তৃক বাতিল (Revoked) করা হয়েছে।" };
      }
      var nowMs = getServerNowMs();
      var expiresAtMs = fsTimeMs(f.expiresAt);
      var createdAtMs = fsTimeMs(f.createdAt);
      if (storedStatus !== "active" || !Number.isFinite(expiresAtMs) || expiresAtMs <= nowMs) {
        return { ok: false, code: "expired", message: "এই Key-এর মেয়াদ শেষ হয়ে গেছে! নতুন Key জেনারেট করে লগইন করুন।" };
      }
      if (Number.isFinite(createdAtMs) && createdAtMs > nowMs + 120000) {
        return { ok: false, code: "invalid_time", message: "এই Key-এর সময়সীমা বৈধ নয়।" };
      }
      var durationMinutes = Math.max(1, fsInt(f.durationMinutes, 15));
      var maxDevices = Math.max(1, fsInt(f.maxDevices, 1));
      var boundDevicesCount = Math.max(0, fsInt(f.boundDevicesCount, 0));
      var deviceResetEpoch = Math.max(0, fsInt(f.deviceResetEpoch, 0));
      var creatorType = fsStr(f.creatorType) === "admin" ? "admin" : "public";
      var publicLockId = fsStr(f.publicLockId);
      var lastBoundDeviceId = fsStr(f.lastBoundDeviceId);
      var managedByAdminEmail = fsStr(f.managedByAdminEmail) || "public_minhaj_portal";

      if (typeof options.expectedEpoch === "number" && deviceResetEpoch !== options.expectedEpoch) {
        return { ok: false, code: "epoch_reset", message: "অ্যাডমিন এই Key-এর ডিভাইস অ্যাক্সেস রিসেট করেছেন। আবার Key দিয়ে লগইন করুন।" };
      }
      if (creatorType === "public" && maxDevices <= 1 && deviceResetEpoch === 0 && DEVICE_ID_RE.test(publicLockId) && publicLockId !== deviceId) {
        return {
          ok: false,
          code: "device_mismatch",
          message: "এই Free Key-টি অন্য ডিভাইসের জন্য তৈরি করা হয়েছে (১ ডিভাইস সীমা)। এই ডিভাইস থেকে নতুন Key জেনারেট করুন।"
        };
      }

      var scopedDevId = deviceResetEpoch > 0 ? ("e" + deviceResetEpoch + "_" + deviceId) : deviceId;
      var scopedDevDocName = FREE_KEY_DB_DOC_ROOT + "/licenseKeys/" + keyCode + "/devices/" + scopedDevId;
      var isDeviceBoundInCloud = (boundDevicesCount > 0 && lastBoundDeviceId === scopedDevId);

      if (!isDeviceBoundInCloud && boundDevicesCount > 0) {
        try {
          var devResp = await fetch(FREE_KEY_BATCH_GET_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            cache: "no-store",
            body: JSON.stringify({ documents: [scopedDevDocName] })
          });
          if (devResp.ok) {
            var devArr = await devResp.json();
            if (Array.isArray(devArr) && devArr[0] && devArr[0].found && devArr[0].found.fields) {
              isDeviceBoundInCloud = true;
            }
          }
        } catch (e) {}
      }

      if (!isDeviceBoundInCloud) {
        if (typeof options.expectedEpoch === "number") {
          return { ok: false, code: "epoch_reset", message: "অ্যাডমিন এই Key-এর ডিভাইস অ্যাক্সেস রিসেট করেছেন। আবার Key দিয়ে লগইন করুন।" };
        }
        if (boundDevicesCount >= maxDevices) {
          return {
            ok: false,
            code: "max_devices",
            message: "এই Key-এর সর্বোচ্চ ডিভাইস সীমা পূর্ণ হয়ে গেছে (" + boundDevicesCount + "/" + maxDevices + " ডিভাইস)।"
          };
        }
        try {
          var nextCount = boundDevicesCount + 1;
          var commitBody = {
            writes: [
              {
                update: {
                  name: keyDocName,
                  fields: {
                    boundDevicesCount: { integerValue: String(nextCount) },
                    lastBoundDeviceId: { stringValue: scopedDevId }
                  }
                },
                updateMask: { fieldPaths: ["boundDevicesCount", "lastBoundDeviceId"] },
                updateTransforms: [{ fieldPath: "updatedAt", setToServerValue: "REQUEST_TIME" }],
                currentDocument: foundKeyDoc.updateTime ? { updateTime: foundKeyDoc.updateTime } : { exists: true }
              },
              {
                update: {
                  name: scopedDevDocName,
                  fields: {
                    deviceId: { stringValue: scopedDevId },
                    keyCode: { stringValue: keyCode },
                    managedByAdminEmail: { stringValue: managedByAdminEmail },
                    deviceResetEpoch: { integerValue: String(deviceResetEpoch) }
                  }
                },
                updateTransforms: [{ fieldPath: "boundAt", setToServerValue: "REQUEST_TIME" }],
                currentDocument: { exists: false }
              }
            ]
          };
          var commitResp = await fetch(FREE_KEY_COMMIT_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            cache: "no-store",
            body: JSON.stringify(commitBody)
          });
          if (!commitResp.ok) {
            return {
              ok: false,
              code: "max_devices",
              message: "এই Key-তে ডিভাইস যুক্ত করা যায়নি বা সীমা পূর্ণ হয়ে গেছে। আবার চেষ্টা করুন।"
            };
          }
          boundDevicesCount = nextCount;
          isDeviceBoundInCloud = true;
        } catch (commitErr) {
          return { ok: false, code: "network_error", message: "ডিভাইস লক সংরক্ষণ করা যায়নি। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।" };
        }
      }

      saveLocalDeviceBinding(keyCode, deviceId, deviceResetEpoch);
      return {
        ok: true,
        session: {
          keyCode: keyCode,
          deviceId: deviceId,
          expiresAtMs: expiresAtMs,
          durationMinutes: durationMinutes,
          maxDevices: maxDevices,
          deviceResetEpoch: deviceResetEpoch,
          creatorType: creatorType,
          verifiedAtServerMs: nowMs
        }
      };
    }

    function updateVaultHeaderCountdownDOM() {
      var sess = getActiveVaultSession();
      if (!sess) {
        if (state.privateUnlocked) {
          forceAutoLockVault("আপনার Access Key-এর মেয়াদ শেষ হয়ে গেছে। নতুন Key জেনারেট করে লগইন করুন।");
        }
        return;
      }
      var timerEl = document.getElementById("vaultKeyTimer");
      if (timerEl) {
        var rem = Math.max(0, sess.expiresAtMs - getServerNowMs());
        timerEl.textContent = formatRemainingVaultTime(rem);
        timerEl.classList.toggle("expiring", rem <= 60000);
      }
    }

    async function revalidateActiveVaultSession() {
      if (vaultRevalidating) return;
      var sess = getActiveVaultSession();
      if (!sess) {
        if (state.privateUnlocked) {
          forceAutoLockVault("আপনার Access Key-এর মেয়াদ শেষ হয়ে গেছে। নতুন Key দিয়ে আবার লগইন করুন।");
        }
        return;
      }
      vaultRevalidating = true;
      try {
        var check = await verifyKeyAgainstFirestore(sess.keyCode, { expectedEpoch: sess.deviceResetEpoch });
        if (!check.ok) {
          if (check.code !== "network_error") {
            forceAutoLockVault(check.message);
          } else if (sess.expiresAtMs <= getServerNowMs()) {
            forceAutoLockVault("আপনার Access Key-এর মেয়াদ শেষ হয়ে গেছে।");
          }
          return;
        }
        if (state.privateUnlocked && isSessionPrivUnlocked()) {
          sessionStorage.setItem(VAULT_SESSION_STORAGE_KEY, JSON.stringify(check.session));
          updateVaultHeaderCountdownDOM();
        }
      } catch (e) {} finally {
        vaultRevalidating = false;
      }
    }

    function startVaultSecurityGuard() {
      stopVaultSecurityGuard();
      vaultTickTimer = setInterval(updateVaultHeaderCountdownDOM, 1000);
      vaultRemoteHeartbeatTimer = setInterval(function() {
        if (state.privateUnlocked) revalidateActiveVaultSession();
      }, 20000);
    }

    function forceAutoLockVault(reasonMsg) {
      setSessionPrivUnlocked(false);
      pendingPrivateTargetPath = "/private-vault";
      stopAndCloseOverlaysSilent();
      state.privateUnlocked = false;
      state.selectedItem = null;
      render();
      scrollToInstant(0);
      setHistorySafe("replace", {
        tab: state.tab || "home",
        underlyingItemId: null,
        underlyingPrivate: false,
        canBackFromModal: false,
        canBackToList: false
      }, "/private-login");
      renderPrivateLoginModalSilent(reasonMsg || "আপনার Access Key-এর মেয়াদ শেষ হয়ে গেছে।");
      updateDocumentTitle("Private Vault Login");
      showToast("Private Vault লক হয়েছে");
    }

    async function smartReadMinhajKey() {
      var isRestrictedWebView = false;
      try {
        if (window.self !== window.top) isRestrictedWebView = true;
      } catch (e) {
        isRestrictedWebView = true;
      }
      var ua = (typeof navigator !== "undefined" && navigator.userAgent) || "";
      if (/; wv\)|\bwv\b/i.test(ua)) isRestrictedWebView = true;

      if (typeof navigator !== "undefined" && navigator.clipboard && typeof navigator.clipboard.readText === "function") {
        try {
          var clipPromise = navigator.clipboard.readText();
          var clipTimeout = new Promise(function(resolve) { setTimeout(function() { resolve(""); }, isRestrictedWebView ? 350 : 1200); });
          var clipText = await Promise.race([clipPromise, clipTimeout]);
          var extractedClip = extractMinhajKeyCode(clipText);
          if (extractedClip && VALID_MINHAJ_KEY_RE.test(extractedClip)) {
            return extractedClip;
          }
        } catch (e) {}
      }

      try {
        var recent = sessionStorage.getItem(SHARED_RECENT_KEY_V2) ||
                     localStorage.getItem(SHARED_RECENT_KEY_V2) ||
                     localStorage.getItem(SHARED_RECENT_KEY_V1) || "";
        var codeRecent = extractMinhajKeyCode(recent);
        if (codeRecent && VALID_MINHAJ_KEY_RE.test(codeRecent)) {
          return codeRecent;
        }
      } catch (e) {}

      try {
        var rawLock = localStorage.getItem(SHARED_ACTIVE_LOCK_V4);
        if (rawLock) {
          var parsedLock = JSON.parse(rawLock);
          if (parsedLock && parsedLock.status === "active" && Number(parsedLock.expiresAtMs || 0) > getServerNowMs()) {
            var lockKey = extractMinhajKeyCode(parsedLock.keyCode);
            if (lockKey && VALID_MINHAJ_KEY_RE.test(lockKey)) return lockKey;
          }
        }
      } catch (e) {}

      return "";
    }

    function scrollToInstant(y) {
      var target = typeof y === "number" ? y : 0;
      try {
        window.scrollTo({ top: target, left: 0, behavior: "instant" });
      } catch (e) {
        window.scrollTo(0, target);
      }
      document.documentElement.scrollTop = target;
      document.body.scrollTop = target;
    }

    function normalizePathname(rawPath) {
      var p = String(rawPath || "/").trim();
      try { p = decodeURIComponent(p); } catch (e) {}
      p = p.replace(/\/index\.html$/i, "/").replace(/\/+/g, "/");
      if (p.length > 1 && p.charAt(p.length - 1) === "/") {
        p = p.slice(0, -1);
      }
      return p || "/";
    }

    function getCurrentCleanPath() {
      return normalizePathname(window.location.pathname);
    }

    function tabToPath(tab) {
      if (tab === "apps") return "/apps";
      if (tab === "games") return "/games";
      if (tab === "prompts") return "/prompts";
      return "/";
    }

    function setHistorySafe(mode, stateObj, targetPath) {
      var cleanTarget = normalizePathname(targetPath || "/");
      try {
        if (window.location.protocol === "file:") {
          if (mode === "replace") history.replaceState(stateObj, "");
          else history.pushState(stateObj, "");
          return;
        }
        if (mode === "replace" || getCurrentCleanPath() === cleanTarget) {
          history.replaceState(stateObj, "", cleanTarget);
        } else {
          history.pushState(stateObj, "", cleanTarget);
        }
      } catch (e) {}
    }

      if (state.privateUnlocked) return "vault";

    window.copyDetailPrompt = function(idOrSlug, btn) {
      var item = findCatalogItem(idOrSlug);
      if (!item || !item.promptText) return;
      copyText(item.promptText, 'Copied "' + item.name + '"');
      if (btn) {
        var origHTML = btn.innerHTML;
        btn.classList.add("copied");

          btn.classList.remove("copied");

    window.openItemById = function(idOrSlug) {
      var found = findCatalogItem(idOrSlug);
      if (!found) return;
      saveCurrentScrollToHistory();
      if (state.privateUnlocked) {
        setSessionPrivUnlocked(false);
      }
      stopAndCloseOverlaysSilent();
      var alreadyInDetail = Boolean(state.selectedItem || state.privateUnlocked);
      var canBack = alreadyInDetail
        ? Boolean(history.state && history.state.canBackToList)
        : true;
      state.selectedItem = found;
      state.privateUnlocked = false;
      setHistorySafe("push", {
        tab: state.tab,
        itemId: found.id,
        canBackToList: canBack,
        canBackFromModal: false,
        detailScrollY: 0
      }, found.routePath);
      render();
      updateDocumentTitle();
      scrollToInstant(0);
    };
    window.openItemBySlug = window.openItemById;

    window.backToMain = function(forceLockVault) {
      pendingPrivateTargetPath = null;
      if (forceLockVault || state.privateUnlocked) {
        setSessionPrivUnlocked(false);
      }
      if (history.state && history.state.canBackToList) {
        try {
          history.back();
          return;
        } catch (e) {}
      }
      var restoreY = savedScrollY;
      stopAndCloseOverlaysSilent();
      state.selectedItem = null;
      state.privateUnlocked = false;
      setHistorySafe("push", {
        tab: state.tab,
        scrollY: restoreY,
        canBackToList: false,
        canBackFromModal: false
      }, tabToPath(state.tab));
      render();
      updateDocumentTitle();
      scrollToInstant(restoreY);
    };

    window.switchTab = function(tab) {
      pendingPrivateTargetPath = null;
      saveCurrentScrollToHistory();
      if (state.privateUnlocked) {
        setSessionPrivUnlocked(false);
      }
      stopAndCloseOverlaysSilent();
      savedScrollY = 0;
      state.tab = tab;
      state.selectedItem = null;
      state.privateUnlocked = false;
      state.search = "";
      setHistorySafe("push", {
        tab: tab,
        scrollY: 0,
        canBackToList: false,
        canBackFromModal: false
      }, tabToPath(tab));
      render();
      updateDocumentTitle();
      scrollToInstant(0);
    };

    function render() {
      syncNavHighlight();
      var root = document.getElementById("appRoot");

      if (state.privateUnlocked) {
        root.innerHTML = renderPrivateVault();
        currentRenderedKey = computeCurrentBaseKey();
        return;
      }

      if (state.selectedItem) {
        root.innerHTML = renderDetail(state.selectedItem);
        currentRenderedKey = computeCurrentBaseKey();
        return;

          '<div class="notice-content"><div class="notice-track"><span>' + esc(DATA.BRAND_CONFIG.announcementText) + '</span><span aria-hidden="true">' + esc(DATA.BRAND_CONFIG.announcementText) + '</span></div></div>' +
        '</a></div>';
      }

      if (q) {
        var matchFn = function(it) {
          return [it.name, it.developer, it.version, it.description, it.promptText].filter(Boolean).join(" ").toLowerCase().indexOf(q) !== -1;
        };
        var fApps = DATA.APPS.filter(matchFn);
        var fGames = DATA.GAMES.filter(matchFn);
        var fPrompts = DATA.AI_PROMPTS.filter(matchFn);

        if (!fApps.length && !fGames.length && !fPrompts.length) {

            '<button type="button" class="btn-poloja btn-dl" style="width:auto;display:inline-flex;padding:8px 18px;font-size:12px;margin:0;" onclick="state.search=\'\';render();">Clear Search</button>' +
          '</div></div>';
        } else {
          if (fApps.length) {
            html += '<div class="section-title">' + ICONS.layers + '<span>Matching Apps (' + fApps.length + ')</span></div><div class="app-grid">' + fApps.map(function(a){ return cardHTML(a, false); }).join("") + '</div>';

          if (fGames.length) {
            html += '<div class="section-title">' + ICONS.flame + '<span>Matching Games (' + fGames.length + ')</span></div><div class="app-grid">' + fGames.map(function(g){ return cardHTML(g, false); }).join("") + '</div>';
          }
          if (fPrompts.length) {
            html += '<div class="section-title">' + ICONS.robot + '<span>Matching AI Prompts (' + fPrompts.length + ')</span></div><div class="ai-tools-grid">' + fPrompts.map(promptCardHTML).join("") + '</div>';

      } else {
        if (state.tab === "home" || state.tab === "prompts") {
          html += '<div class="section-title">' + ICONS.robot + '<span>AI Prompt (' + DATA.AI_PROMPTS.length + ')</span></div>' +

          html += '<div class="section-title">' + ICONS.layers + '<span>Latest Updates (' + DATA.APPS.length + ')</span></div>' +
            '<div class="app-grid">' + DATA.APPS.map(function(a){ return cardHTML(a, false); }).join("") + '</div>';

        if (state.tab === "home" || state.tab === "games") {
          html += '<div class="section-title">' + ICONS.flame + '<span>Games Update (' + DATA.GAMES.length + ')</span></div>' +

          state.search = "";
          render();

    window.submitPrivateKey = async function(e) {
      e.preventDefault();
      if (keyVerifyInFlight) return;

      var inp = document.getElementById("privKeyInput");
      var err = document.getElementById("privErr");
      var btn = document.getElementById("privSubmitBtn");
      var rawVal = inp ? inp.value : "";

      if (err) {
        err.style.color = "#f43f5e";
        err.textContent = "";
      }

      var normalizedCandidate = extractMinhajKeyCode(rawVal);
      if (!normalizedCandidate) {
        if (err) err.textContent = "অনুগ্রহ করে আপনার Access Key লিখুন।";
        return;
      }
      if (inp && VALID_MINHAJ_KEY_RE.test(normalizedCandidate)) {
        inp.value = normalizedCandidate;
        syncPrivKeyClearBtn();
      }

      keyVerifyInFlight = true;
      if (btn) {
        btn.disabled = true;
        btn.style.opacity = "0.78";
        btn.innerHTML = ICONS.spinner + "<span>Key যাচাই হচ্ছে...</span>";
      }

      var result;
      try {
        result = await verifyKeyAgainstFirestore(normalizedCandidate);
      } catch (ex) {
        result = { ok: false, code: "network_error", message: "Key যাচাই করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।" };
      } finally {
        keyVerifyInFlight = false;
        var currentBtn = document.getElementById("privSubmitBtn");
        if (currentBtn) {
          currentBtn.disabled = false;
          currentBtn.style.opacity = "1";
          currentBtn.innerHTML = "<span>Unlock Private Vault</span>";
        }
      }

      if (!result || !result.ok) {
        var currentErr = document.getElementById("privErr");
        if (currentErr) {
          currentErr.style.color = "#f43f5e";
          currentErr.textContent = (result && result.message) || "ভুল অথবা মেয়াদোত্তীর্ণ Access Key দেওয়া হয়েছে।";
        }
        return;
      }

      setSessionPrivUnlocked(true, result.session);
      var wasFromModal = Boolean(history.state && history.state.canBackFromModal);
      var targetPrivRes = pendingPrivateTargetPath ? findPrivateResourceItem(pendingPrivateTargetPath) : null;
      pendingPrivateTargetPath = null;

      stopAndCloseOverlaysSilent();
      state.privateUnlocked = true;
      state.selectedItem = null;
      render();
      scrollToInstant(0);
      showToast("Private Vault আনলক হয়েছে");

      if (targetPrivRes) {
        setHistorySafe("replace", {
          tab: state.tab,
          underlyingPrivate: true,
          canBackFromModal: false,
          canBackToList: wasFromModal
        }, targetPrivRes.routePath);
        renderPrivateDlConfirmSilent(targetPrivRes);
        updateDocumentTitle(targetPrivRes.title);
      } else {
        setHistorySafe("replace", {
          tab: state.tab,
          canBackToList: wasFromModal,
          canBackFromModal: false,
          vaultScrollY: 0
        }, "/private-vault");
        updateDocumentTitle();
      }
    };

    function parseLocationRoute() {
      var pathname = getCurrentCleanPath();

      // Legacy ?id=... support for backwards compatibility
      try {
        var qParams = new URLSearchParams(window.location.search);
        var legacyId = qParams.get("id");
        if (pathname === "/" && legacyId) {
          var lid = legacyId.trim();
          if (lid === "home") return { type: "home", canonicalPath: "/" };
          if (lid === "all-apps" || lid === "apps") return { type: "tab", tab: "apps", canonicalPath: "/apps" };
          if (lid === "all-games" || lid === "games") return { type: "tab", tab: "games", canonicalPath: "/games" };
          if (lid === "ai-prompts" || lid === "prompts") return { type: "tab", tab: "prompts", canonicalPath: "/prompts" };
          if (lid === "qr-scanner") return { type: "qr", canonicalPath: "/qr-scanner" };
          if (lid === "private-login") return { type: "private-login", canonicalPath: "/private-login" };
          if (lid === "private-vault") return { type: "private-vault", canonicalPath: "/private-vault" };
          if (lid.indexOf("tutorial-") === 0) {
            var ltItem = findCatalogItem(lid.slice(9));
            if (ltItem) return { type: "tutorial", item: ltItem, canonicalPath: ltItem.routePath + "/tutorial" };
          }
          if (lid.indexOf("preview-") === 0) {
            var lpItem = findCatalogItem(lid.slice(8));
            if (lpItem) return { type: "preview", item: lpItem, canonicalPath: lpItem.routePath + "/preview" };
          }
          var lInfo = findFooterInfoItem(lid);
          if (lInfo) return { type: "info", info: lInfo, canonicalPath: lInfo.routePath };
          var lPriv = findPrivateResourceItem(lid);
          if (lPriv) return { type: "priv-res", res: lPriv, canonicalPath: lPriv.routePath };
          var lCat = findCatalogItem(lid);
          if (lCat) return { type: "detail", item: lCat, canonicalPath: lCat.routePath };
        }
      } catch (e) {}

      if (pathname === "/") {
        return { type: "home", canonicalPath: "/" };
      }

      var segments = pathname.slice(1).split("/");
      var first = (segments[0] || "").toLowerCase();
      var second = segments[1] || "";
      var third = (segments[2] || "").toLowerCase();

      if (first === "apps" || first === "all-apps") {
        return { type: "tab", tab: "apps", canonicalPath: "/apps" };
      }
      if (first === "games" || first === "all-games") {
        return { type: "tab", tab: "games", canonicalPath: "/games" };
      }
      if (first === "prompts" || first === "ai-prompts") {
        return { type: "tab", tab: "prompts", canonicalPath: "/prompts" };
      }
      if (first === "qr-scanner") {
        return { type: "qr", canonicalPath: "/qr-scanner" };
      }
      if (first === "private-login") {
        return { type: "private-login", canonicalPath: "/private-login" };
      }
      if (first === "private-vault") {
        return { type: "private-vault", canonicalPath: "/private-vault" };
      }
      if (first === "info" && second) {
        var infoObj = findFooterInfoItem(second);
        if (infoObj) return { type: "info", info: infoObj, canonicalPath: infoObj.routePath };
      }
      if (first === "vault" && second) {
        var privObj = findPrivateResourceItem(second);
        if (privObj) return { type: "priv-res", res: privObj, canonicalPath: privObj.routePath };
      }
      if ((first === "app" || first === "game" || first === "prompt") && second) {
        var catItem = findCatalogItem(second, first);
        if (catItem) {
          if (third === "tutorial") {
            return { type: "tutorial", item: catItem, canonicalPath: catItem.routePath + "/tutorial" };
          }
          if (third === "preview") {
            return { type: "preview", item: catItem, canonicalPath: catItem.routePath + "/preview" };
          }
          return { type: "detail", item: catItem, canonicalPath: catItem.routePath };
        }
      }
      if (first === "tutorial" && second) {
        var tutTarget = findCatalogItem(second);
        if (tutTarget) return { type: "tutorial", item: tutTarget, canonicalPath: tutTarget.routePath + "/tutorial" };
      }

      if (segments.length === 1) {
        var singleInfo = findFooterInfoItem(first);
        if (singleInfo) return { type: "info", info: singleInfo, canonicalPath: singleInfo.routePath };
        var singlePriv = findPrivateResourceItem(first);
        if (singlePriv) return { type: "priv-res", res: singlePriv, canonicalPath: singlePriv.routePath };
        var singleCat = findCatalogItem(first);
        if (singleCat) return { type: "detail", item: singleCat, canonicalPath: singleCat.routePath };
      }

      return { type: "unknown", canonicalPath: "/" };
    }

    }

    /* Init Wire-up */
    (function init() {
      syncThemeIcon();

      document.getElementById("themeBtn").addEventListener("click", function() {
        var dark = !document.documentElement.classList.contains("dark");
        document.documentElement.classList.toggle("dark", dark);
        try { localStorage.setItem("minhaj_theme", dark ? "dark" : "light"); } catch (e) {}
        syncThemeIcon();
      });

      var menuBtn = document.getElementById("menuBtn");
      var menuDropdown = document.getElementById("menuDropdown");
      var menuContainer = document.getElementById("menuContainer");

      function closeDropdown() {
        menuDropdown.classList.remove("show");
        menuBtn.classList.remove("active");
      }

      document.getElementById("brandHomeBtn").addEventListener("click", function(e) {
        if (!isPlainLeftClick(e)) return;
        e.preventDefault();
        closeDropdown();
        switchTab("home");
      });

      menuBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        var open = menuDropdown.classList.toggle("show");
        menuBtn.classList.toggle("active", open);
      });

      document.addEventListener("click", function(e) {
        if (menuContainer && !menuContainer.contains(e.target)) {
          closeDropdown();
        }
      });

      document.addEventListener("contextmenu", function(e) {
        var t = e.target;
        if (t && (t.tagName === "IMG" || t.tagName === "VIDEO" || t.tagName === "SVG")) {
          e.preventDefault();
        }
      });

      document.getElementById("openQrBtn").addEventListener("click", function(e) {
        if (!isPlainLeftClick(e)) return;
        e.preventDefault();
        closeDropdown();
        openQrModal();
      });

      document.getElementById("openPrivateLoginBtn").addEventListener("click", function(e) {
        if (!isPlainLeftClick(e)) return;
        e.preventDefault();
        closeDropdown();
        openPrivateLoginModal();
      });

      document.querySelectorAll("[data-tab]").forEach(function(link) {
        link.addEventListener("click", function(e) {
          if (!isPlainLeftClick(e)) return;
          e.preventDefault();
          closeDropdown();
          switchTab(link.getAttribute("data-tab"));
        });
      });

      document.getElementById("menuSocialItems").innerHTML = DATA.SOCIAL_LINKS.map(function(s) {
        var label = s.name === "Telegram" ? "Join Telegram" : s.name;
        return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer" class="menu-item">' +
          '<span class="menu-icon-slot">' + socialBrandSvg(s.name) + '</span>' +
          '<span>' + esc(label) + '</span>' +
        '</a>';
      }).join("");

      document.getElementById("menuSocialItems").addEventListener("click", function() {
        closeDropdown();
      });

      document.getElementById("footerLinks").innerHTML = DATA.FOOTER_INFO_ITEMS.map(function(f) {
        return '<a href="' + esc(f.routePath) + '" onclick="return handleInfoClick(event, \'' + esc(f.id) + '\')">' + esc(f.label) + '</a><span>|</span>';
      }).join("") + '<a href="' + esc(DATA.BRAND_CONFIG.telegramUrl) + '" target="_blank" rel="noopener noreferrer">Telegram</a>';

      document.getElementById("modalOverlay").addEventListener("click", closeModal);
      document.getElementById("lightboxOverlay").addEventListener("click", closeLightbox);

      document.addEventListener("keydown", function(e) {
        if (e.key === "Escape" && isAnyOverlayOpen()) {
          closeOverlaysFromUI();
        }
      });

      function handleTabReturnSync() {
        if (state.privateUnlocked) {
          updateVaultHeaderCountdownDOM();
          revalidateActiveVaultSession();
        }
      }

      window.addEventListener("focus", handleTabReturnSync);
      document.addEventListener("visibilitychange", function() {
        if (document.visibilityState === "visible") {
          handleTabReturnSync();
        }
      });

      window.addEventListener("popstate", function(e) {
        closeDropdown();
        applyRouteFromLocation(e.state || {}, false);
      });

      applyRouteFromLocation(history.state || {}, true);
    })();
  </script>
</body>
</html>
